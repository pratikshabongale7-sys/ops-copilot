# Continuous Deployment — pushes the repo to the Hugging Face Space on every
# successful push to main, so the live demo always reflects main. This is the
# "→ build → deploy" half of the pipeline (HF builds the Docker image on its side).
#
# Setup required once (see PHASE6_SETUP_GUIDE.md):
#   - Create a Docker Space on Hugging Face.
#   - Add two GitHub repo secrets:  HF_TOKEN (a HF write token)  and  HF_SPACE
#     (e.g. "your-username/ops-copilot").
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a clean snapshot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Build a single fresh commit (no history) containing ONLY what the Space
          # needs. This avoids pushing binaries buried in git history (e.g. an old
          # mlflow.db) and keeps the Space repo minimal.
          git checkout --orphan hf-deploy
          rm -rf docs evaluation tests scripts mlruns mlartifacts mlflow.db *.db __pycache__ 2>/dev/null || true
          git add -A
          git commit -m "Deploy from GitHub Actions"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
