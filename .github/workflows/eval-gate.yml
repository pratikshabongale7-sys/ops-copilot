# Evaluation gate — the quality gate for the AGENT (not just code correctness).
#
# Runs the eval on the held-out test set and FAILS the job if accuracy or macro-F1
# drops below a threshold, so a model/prompt regression surfaces before shipping.
#
# It runs on a SCHEDULE (nightly) and ON DEMAND — not on every push — because a live
# LLM eval is slow, costs quota, and is non-deterministic. That's the deliberate,
# honest tradeoff: gate on the held-out set nightly rather than flakily on each commit.
#
# Setup: add an LLM key as a repo secret (GROQ_API_KEY) and, if you like, set the
# thresholds as repo variables (GATE_MIN_ACCURACY, GATE_MIN_MACRO_F1).
name: Eval gate

on:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "0 3 * * *"     # nightly at 03:00 UTC

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Generate the incident dataset
        run: uv run python data/generate_incidents.py

      - name: Run the eval gate (fails on regression)
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GATE_MIN_ACCURACY: ${{ vars.GATE_MIN_ACCURACY || '0.83' }}
          GATE_MIN_MACRO_F1: ${{ vars.GATE_MIN_MACRO_F1 || '0.77' }}
        run: uv run python evaluation/gate.py --diagnoser agent --run
