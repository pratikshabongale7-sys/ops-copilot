# Continuous Integration — runs on every push and pull request.
# Installs deps, lints, and runs the tests. This is the "test → " part of the
# pipeline: nothing merges to main without passing here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Generate the incident dataset (tests need it)
        run: uv run python data/generate_incidents.py

      - name: Run tests
        run: uv run pytest -v
